---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nocodb-data
  namespace: nocodb
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nocodb
  namespace: nocodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nocodb
  template:
    metadata:
      labels:
        app: nocodb
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: nocodb
      containers:
        - name: nocodb
          image: nocodb/nocodb:0.265.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 512Mi
          env:
            # --- БД NocoDB (Postgres) ---
            - name: NC_DB
              value: "pg://postgres-postgresql.postgres.svc.cluster.local:5432?u=nocodb_user&p=6e62f86fabefb9c141e98595e19becbf&d=nocodb"

            # JWT secret
            - name: NC_AUTH_JWT_SECRET
              value: "f56b45f299945f7abb6682d25561279bd796b9c359431d21d40c509752c3515a"

            # Вырубаем кэш → Redis не обязателен
            - name: NC_DISABLE_CACHE
              value: "true"

            # Публичный URL (не обязателен, но полезен)
            - name: NC_PUBLIC_URL
              value: "https://data.fedorov-team.tech"

            # Телеметрия по вкусу
            - name: NC_DISABLE_TELE
              value: "true"

            # Админ
            - name: NC_ADMIN_EMAIL
              value: "Broadcast7826@gmail.com"
            - name: NC_ADMIN_PASSWORD
              value: "%Md7ST68ZrkR6!ar"

            # Дебаг
            - name: DEBUG
              value: "nc:*,knex:*"
            - name: NC_ENABLE_ALL_API_ERROR_LOGGING
              value: "true"

          volumeMounts:
            - name: data
              mountPath: /usr/app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nocodb-data
---
apiVersion: v1
kind: Service
metadata:
  name: nocodb
  namespace: nocodb
spec:
  selector:
    app: nocodb
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nocodb
  namespace: nocodb
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
    - hosts:
        - data.fedorov-team.tech
      secretName: nocodb-tls
  rules:
    - host: data.fedorov-team.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nocodb
                port:
                  number: 8080
