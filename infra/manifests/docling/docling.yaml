# infra/manifests/docling/docling.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docling-serve
  namespace: docling
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docling-serve
  template:
    metadata:
      labels:
        app: docling-serve
    spec:
      containers:
        - name: docling-serve
          image: harbor.tech.fedorov-team.tech/backend/docling-serve-cpu:with-rus
          imagePullPolicy: Always
          env:
            - name: DOCLING_SERVE_ENABLE_UI
              value: "1"
            - name: DOCLING_SERVE_RESULT_REMOVAL_DELAY
              value: "6200"
            - name: DOCLING_SERVE_SINGLE_USE_RESULTS
              value: "true"
            - name: DOCLING_SERVE_MAX_FILE_SIZE
              value: "104857600"      # 100 MiB
            - name: DOCLING_SERVE_MAX_NUM_PAGES
              value: "1000"
            - name: DOCLING_SERVE_ENG_KIND
              value: "local"
            - name: DOCLING_SERVE_ENG_LOC_NUM_WORKERS
              value: "2"              # 2 параллельных задачи
            - name: DOCLING_SERVE_ENG_LOC_SHARE_MODELS
              value: "true"           # делить модели между воркерам
            - name: DOCLING_NUM_THREADS
              value: "3"              # torch-потоки
            - name: DOCLING_DEVICE
              value: "cpu"
            - name: DOCLING_PERF_PAGE_BATCH_SIZE
              value: "4"
            - name: DOCLING_PERF_ELEMENTS_BATCH_SIZE
              value: "8"
            # при желании сюда можно добавить другие env из .env.example
          ports:
            - containerPort: 5001
              name: http
          resources:
            requests:
              cpu: "3"
              memory: "2Gi"
            limits:
              cpu: "5"
              memory: "6Gi"
          # Если потребуется доступ к модели/кэшу на диске – сюда можно добавить volumeMounts
---
apiVersion: v1
kind: Service
metadata:
  name: docling
  namespace: docling
spec:
  selector:
    app: docling-serve
  ports:
    - name: http
      port: 80
      targetPort: 5001
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docling
  namespace: docling
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
    - hosts:
        - docling.tech.fedorov-team.tech
      secretName: docling-tls
  rules:
    - host: docling.tech.fedorov-team.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: docling
                port:
                  number: 80
