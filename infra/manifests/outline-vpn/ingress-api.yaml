# infra/manifests/outline-vpn/ingress-api.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shadowbox-api
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/service.serversscheme: https
spec:
  tls:
    - hosts:
        - vpn.tech.fedorov-team.tech
      secretName: shadowbox-tls
  rules:
    - host: vpn.tech.fedorov-team.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shadowbox-api
                port:
                  number: 12000
