# infra/manifests/outline-vpn/service-keys.yaml
apiVersion: v1
kind: Service
metadata:
  name: shadowbox-keys
spec:
  selector:
    app: shadowbox
  type: LoadBalancer
  ports:
    - name: keys-tcp
      port: 12001
      targetPort: 12001
      protocol: TCP
    - name: keys-udp
      port: 12001
      targetPort: 12001
      protocol: UDP
