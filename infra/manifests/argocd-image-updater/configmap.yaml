# infra/manifests/argocd-image-updater/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-image-updater-config
  namespace: argocd
data:
  registries.conf: |
    registries:
      - name: harbor
        api_url: https://harbor.tech.fedorov-team.tech
        prefix: harbor.tech.fedorov-team.tech
        credentials: secret:argocd/argocd-image-updater-registry-creds#harbor-creds
