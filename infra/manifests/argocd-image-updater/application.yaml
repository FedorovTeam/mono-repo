apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argocd
spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  # Multi-source: 1) Helm chart 2) Git path (Secret)
  sources:
    # (1) Install argocd-image-updater via Helm chart
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argocd-image-updater
      targetRevision: 1.0.3
      helm:
        releaseName: argocd-image-updater
        values: |
          # Chart installs Argo CD Image Updater
          # Registries config is dumped into its ConfigMap by the chart. :contentReference[oaicite:2]{index=2}
          config:
            # Every 2 minutes (adjust if you want)
            interval: 2m

            # Registry configuration for Harbor
            registries:
              - name: harbor
                api_url: https://harbor.tech.fedorov-team.tech
                prefix: harbor.tech.fedorov-team.tech
                default: false
                insecure: false
                credentials: secret_ref:secret:argocd/argocd-image-updater-registry-creds#harbor-creds

          # RBAC: allow patching Argo CD Applications in-cluster
          rbac:
            enabled: true

          serviceAccount:
            create: true
            name: argocd-image-updater

          # If you want more logs:
          # extraArgs:
          #   - --loglevel
          #   - debug

    # (2) Apply the Secret with Harbor credentials
    - repoURL: git@github.com:FedorovTeam/mono-repo.git
      targetRevision: main
      path: infra/manifests/argocd-image-updater
      directory:
        recurse: true

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
