# modules/ci/argo-workflows/rbac/ci-bot-role.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-bot
  namespace: argo
---
apiVersion: v1
kind: Secret
metadata:
  name: ci-bot.service-account-token
  namespace: argo
  annotations:
    kubernetes.io/service-account.name: ci-bot
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-bot-role
  namespace: argo
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["argoproj.io"]
    resources: ["workflows", "workflowtemplates", "cronworkflows"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-bot-binding
  namespace: argo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-bot-role
subjects:
  - kind: ServiceAccount
    name: ci-bot
    namespace: argo
