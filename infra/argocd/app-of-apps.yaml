# ArgoCD App of Apps pattern for fedorov-team

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fedorov-team-app-of-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:FedorovTeam/mono-repo.git
    targetRevision: main
    path: infra/argocd
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
