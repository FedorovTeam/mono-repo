apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: budibase
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://budibase.github.io/budibase      # helm-репо Budibase
    chart: budibase
    targetRevision: 3.0.493                          # или другая существующая версия
    helm:
      values: |
        ingress:
          enabled: true
          className: "traefik"
          annotations:
            cert-manager.io/cluster-issuer: "letsencrypt"
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
          hosts:
            - host: budibase.tech.fedorov-team.tech
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - hosts:
                - budibase.tech.fedorov-team.tech
              secretName: budibase-tls

        couchdb:
          enabled: true
          persistentVolume:
            enabled: true
            size: 10Gi

        # внешний Redis (твой)
        redis:
          enabled: false        # встроенный Redis отключаем
        globals:
          redis:
            host: redis-master.redis.svc.cluster.local
            port: 6379
            # password: ""      # если нужен пароль — вынеси в секрет и подключи envFrom

        # внешний MinIO (твой)
        objectStore:
          minio: false          # встроенный MinIO не поднимаем
        globals:
          objectStore:
            url: https://api.minio.tech.fedorov-team.tech
            accessKey: 0t4IWkzYzMKfFsfNOdWs
            secretKey: dJ1CiwAjlLdpui0erccAeC1DaPv0USrUP2Uvd3rv
            region: ru-central
            bucket: budibase

        # пример: фиксированный JWT_SECRET, чтобы не терять логины при апгрейдах
        globals:
          createSecrets: false
          jwtSecret: "super-long-random-jwt-secret"
          internalApiKey: "super-long-random-internal-api-key"
          apiEncryptionKey: "super-long-random-encryption-key"
