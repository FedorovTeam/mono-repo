# argocd/budibase-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: budibase
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:FedorovTeam/mono-repo.git
    targetRevision: HEAD
    path: infra/manifests/budibase
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: budibase
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
