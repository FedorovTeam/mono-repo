apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: budibase
  namespace: argocd
spec:
  project: default
  source:
    # ВАЖНО: здесь уже НЕ твой mono-repo, а helm-репо Budibase
    repoURL: https://budibase.github.io/budibase/
    chart: budibase
    targetRevision: 2.3.25 # или любой актуальный tag из helm repo
    helm:
      # Здесь же вшиваем values, чтобы не городить multi-source
      values: |-
        ingress:
          enabled: true
          className: "traefik"
          hosts:
            - host: "budibase.tech.fedorov-team.tech"
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: proxy-service
                      port:
                        number: 10000
          annotations:
            cert-manager.io/cluster-issuer: "letsencrypt"
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
          tls:
            - hosts:
                - budibase.tech.fedorov-team.tech
              secretName: budibase-tls

        createSecrets: true

        couchdb:
          enabled: true
          persistentVolume:
            enabled: true
            storageClass: ""
            size: 10Gi

        services:
          proxy:
            replicaCount: 1
          apps:
            replicaCount: 1
          worker:
            replicaCount: 1

          # ВНЕШНИЙ Redis (ТВОЙ)
          redis:
            enabled: false
            url: "redis-master.redis.svc.cluster.local"
            port: 6379
            # если у редиса есть пароль — добавь:
            # password: "YOUR_REDIS_PASSWORD"
            storageClass: ""

          # ВНЕШНЕЕ S3-хранилище (твой MinIO через https)
          objectStore:
            # не поднимать встроенный MinIO
            minio: false
            accessKey: "0t4IWkzYzMKfFsfNOdWs"
            secretKey: "dJ1CiwAjlLdpui0erccAeC1DaPv0USrUP2Uvd3rv"
            # bucket, который ты заведёшь в своём MinIO
            bucket: "budibase"
            region: "ru-central"

  destination:
    server: https://kubernetes.default.svc
    namespace: budibase

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
