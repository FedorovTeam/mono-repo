# argocd/typebot-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: typebot
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:FedorovTeam/mono-repo.git
    targetRevision: HEAD
    path: infra/manifests/typebot
  destination:
    server: https://kubernetes.default.svc
    namespace: typebot
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
