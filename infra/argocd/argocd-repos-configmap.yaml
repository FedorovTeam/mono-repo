apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  repositories: |
    - type: helm
      name: bitnami
      url: https://charts.bitnami.com/bitnami
    - type: helm
      name: hashicorp
      url: https://helm.releases.hashicorp.com
    - type: helm
      name: jetstack
      url: https://charts.jetstack.io
    - type: helm
      name: minio
      url: https://operator.min.io
    - type: helm
      name: harbor
      url: https://helm.goharbor.io
    - type: helm
      name: harbor-internal
      url: http://harbor-harbor-chartmuseum.harbor.svc.cluster.local/chartrepo/helm
    - type: helm
      name: cloudposse-incubator
      url: https://charts.cloudposse.com/incubator
    - type: git
      name: ovpn-admin
      url: https://github.com/palark/ovpn-admin.git
    - type: git
      name: mono-repo
      url: git@github.com:FedorovTeam/mono-repo.git
  accounts.ci: apiKey, login
