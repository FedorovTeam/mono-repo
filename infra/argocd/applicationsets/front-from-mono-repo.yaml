apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: mono-repo-frontend
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: git@github.com:FedorovTeam/mono-repo.git
        revision: main
        directories:
          # front/<app>/charts/<chart>
          - path: "front/*/charts/*"
  template:
    metadata:
      # parts: ["front", "<app>", "charts", "<chart>"]
      # app: index 1
      name: '{{ $parts := splitList "/" .path.path }}{{ $service := index $parts 1 | lower | replace "_" "-" }}{{ printf "app-%s" $service }}'
      labels:
        managed-by: application-set
        service: '{{ index (splitList "/" .path.path) 1 }}'
        mono-repo: front
    spec:
      project: default
      source:
        repoURL: git@github.com:FedorovTeam/mono-repo.git
        targetRevision: main
        path: '{{ .path.path }}'
        helm:
          valueFiles: []
          values: |
            replicaCount: 1
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ index (splitList "/" .path.path) 1 }}'
      syncPolicy:
        automated:
          selfHeal: true
          prune: false
        syncOptions:
          - CreateNamespace=true
