# infra/argocd/applicationsets/services-from-mono-repo.yaml
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: mono-repo-services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/source/helm/parameters

  generators:
    - git:
        repoURL: git@github.com:FedorovTeam/mono-repo.git
        revision: main
        directories:
          # backend/<service>/charts/<chart>
          - path: "backend/*/charts/*"
  template:
    metadata:
      # parts: ["backend", "<service>", "charts", "<chart>"]
      # service: index 1
      name: '{{ $parts := splitList "/" .path.path }}{{ $service := index $parts 1 | lower | replace "_" "-" }}{{ printf "app-%s" $service }}'
      labels:
        managed-by: application-set
        service: '{{ index (splitList "/" .path.path) 1 }}'
        mono-repo: backend
      annotations:
        argocd.argoproj.io/compare-options: IgnoreExtraneous

        # --- Argo CD Image Updater ---
        # Следим за образом в Harbor: harbor.../backend/<service>
        argocd-image-updater.argoproj.io/image-list: >-
          svc=harbor.tech.fedorov-team.tech/backend/{{ $parts := splitList "/" .path.path }}{{ $service := index $parts 1 | lower | replace "_" "-" }}{{ $service }}

        # Берём самый новый тег среди разрешённых
        argocd-image-updater.argoproj.io/svc.update-strategy: newest-build

        # Разрешаем только SHA-теги (7..40 hex), чтобы не прыгать на latest
        argocd-image-updater.argoproj.io/svc.allow-tags: regexp:^[0-9a-f]{7,40}$

        # Куда писать тег в Helm values
        argocd-image-updater.argoproj.io/svc.helm.image-tag: image.tag

        # Пишем обратно прямо в Argo CD Application (без коммитов в Git)
        argocd-image-updater.argoproj.io/write-back-method: argocd

        # (опционально) принудительно обновлять состояние приложения
        argocd-image-updater.argoproj.io/refresh: hard

    spec:
      project: default
      source:
        repoURL: git@github.com:FedorovTeam/mono-repo.git
        targetRevision: main
        path: '{{ .path.path }}'
        helm:
          valueFiles: []
          values: |
            replicaCount: 1
            image:
              tag: "latest"
#            resources:
#              requests:
#                cpu: 50m
#                memory: 64Mi
#              limits:
#                cpu: 100m
#                memory: 128Mi
      destination:
        server: https://kubernetes.default.svc
        # namespace = <service> (backend/<service>/...)
        namespace: '{{ index (splitList "/" .path.path) 1 }}'
      syncPolicy:
        automated:
          selfHeal: true
          prune: false
        syncOptions:
          - CreateNamespace=true
