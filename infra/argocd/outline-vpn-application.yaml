apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: outline-vpn
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:FedorovTeam/mono-repo.git
    targetRevision: main
    path: infra/manifests/outline-vpn
  destination:
    server: https://kubernetes.default.svc
    namespace: outline-vpn
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
