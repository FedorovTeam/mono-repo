service:
  name: preprocess-service
  port: 8082
  grpc_port: 9082
  region: ru-msk-1

postgres:
  dsn: postgres://preprocess:preprocess_password@postgres:5432/preprocess?sslmode=disable

minio:
  endpoint: minio.moiqr.localhost:80
  access_key: PREPROCESS_MINIO_KEY
  secret_key: PREPROCESS_MINIO_SECRET
  ssl: false
  region: us-east-1

preprocess:
  libreoffice_path: /usr/bin/libreoffice
  working_dir: /tmp/preprocess-service/work
  output_dir: /tmp/preprocess-service/output # итоговый DOCX сохраняется здесь, воркер использует подкаталог с job_id
  source_bucket: preprocess-source
  target_bucket: preprocess-artifacts
  target_key_prefix: converted
  target_media_type: application/vnd.openxmlformats-officedocument.wordprocessingml.document
  worker_concurrency: 2
  convert_timeout: 2m
  backoff: 30s
  poll_interval: 2s

logging:
  level: info
