replicaCount: 1
fullnameOverride: preprocess

image:
  repository: harbor.tech.fedorov-team.tech/backend/preprocess-service
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: regcred

service:
  type: ClusterIP
  port: 8082
  grpcPort: 9082
  annotations: {}

env:
  SERVICE_NAME: preprocess-service
  SERVICE_PORT: 8082
  GRPC_PORT: 9082
  SERVICE_REGION: local
  CONFIG_PATH: /app/config/config.yaml

config:
  secretName: preprocess-service-config
  key: config.yaml
  mountPath: /app/config/config.yaml
  description: "Secret должен содержать ключ config.yaml со всеми параметрами (PostgreSQL, MinIO, LibreOffice путь, воркеры, уровень логов)."

secrets:
  postgresSecret: preprocess-postgres-credentials # содержит DSN или пользователя/пароль PostgreSQL
  minioAccessKeySecret: preprocess-minio-access   # access_key для MinIO
  minioSecretKeySecret: preprocess-minio-secret   # secret_key для MinIO
  notes: "Секреты используются для формирования config.yaml и доступа к БД/хранилищу; в чарте ожидается, что конфиг передаётся через secretName."

resources:
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
