replicaCount: 1
fullnameOverride: preprocess

image:
  repository: harbor.tech.fedorov-team.tech/backend/preprocess-service
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: regcred

service:
  type: ClusterIP
  port: 8082
  grpcPort: 9082
  annotations: {}

env:
  SERVICE_NAME: preprocess-service
  SERVICE_PORT: 8082
  GRPC_PORT: 9082
  SERVICE_REGION: local
  CONFIG_PATH: /app/config/config.yaml

resources:
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
