# backend/preprocess-service/charts/preprocess-service/values.yaml
replicaCount: 1
fullnameOverride: preprocess-service

image:
  repository: harbor.tech.fedorov-team.tech/backend/preprocess-service
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: regcred

service:
  type: ClusterIP
  port: 8080
  grpcPort: 9090

env:
  SERVICE_NAME: preprocess-service
  SERVICE_PORT: 8080
  GRPC_PORT: 9090
  SERVICE_REGION: local

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1024Mi

nodeSelector: {}

tolerations: []

affinity: {}
