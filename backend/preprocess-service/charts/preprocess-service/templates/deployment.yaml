apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "preprocess-service.fullname" . }}
  labels:
    {{- include "preprocess-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "preprocess-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "preprocess-service.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
          env:
            - name: SERVICE_NAME
              value: {{ .Values.env.SERVICE_NAME | quote }}
            - name: SERVICE_PORT
              value: {{ .Values.env.SERVICE_PORT | quote }}
            - name: GRPC_PORT
              value: {{ .Values.env.GRPC_PORT | quote }}
            - name: SERVICE_REGION
              value: {{ .Values.env.SERVICE_REGION | quote }}
            - name: CONFIG_PATH
              value: {{ .Values.env.CONFIG_PATH | quote }}
          volumeMounts:
            - name: config
              mountPath: {{ .Values.config.mountPath | quote }}
              subPath: {{ .Values.config.key | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          secret:
            secretName: {{ .Values.config.secretName }}
            items:
              - key: {{ .Values.config.key }}
                path: {{ .Values.config.key }}
