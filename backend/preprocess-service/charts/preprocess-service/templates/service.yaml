apiVersion: v1
kind: Service
metadata:
  name: {{ include "preprocess-service.fullname" . }}
  labels:
    {{- include "preprocess-service.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: {{ .Values.service.grpcPort }}
      protocol: TCP
  selector:
    {{- include "preprocess-service.selectorLabels" . | nindent 4 }}
