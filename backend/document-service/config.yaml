server:
  addr: ":50051"
postgres:
  dsn: "postgres://postgres:postgres@localhost:5432/document?sslmode=disable"
minio:
  endpoint: "api.minio.tech.fedorov-team.tech"
  access_key: "minio-access-key"
  secret_key: "minio-secret-key"
  use_ssl: true
  original_bucket: "backend-original"
  markdown_bucket: "backend-md"
  bucket_prefix: "documents"
temporal:
  address: "temporal-frontend.temporal.svc.cluster.local:7233"
  namespace: "knowledge-base"
  task_queue: "document-processing"
services:
  storage_service: "storage.backend.svc.cluster.local:50052"
  transformer_service: "transformer.backend.svc.cluster.local:9092"
  github_publisher_service: "github-publisher.backend.svc.cluster.local:9097"
github:
  repository: "FedorovTeam/knowledge-base"
  branch: "main"
