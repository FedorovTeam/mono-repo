syntax = "proto3";

package backend.document.v1;

import "google/protobuf/timestamp.proto";

option go_package = "backend-document-service/proto/backend/document/v1;documentv1";

enum DocumentStatus {
  DOCUMENT_STATUS_UNSPECIFIED = 0;
  DOCUMENT_STATUS_UPLOADED = 1;
  DOCUMENT_STATUS_STORED_ORIGINAL = 2;
  DOCUMENT_STATUS_CONVERTED_TO_MARKDOWN = 3;
  DOCUMENT_STATUS_PUBLISHED_TO_GITHUB = 4;
  DOCUMENT_STATUS_FAILED = 5;
}

message Document {
  string id = 1;
  string file_name = 2;
  string repository = 3;
  string branch = 4;
  string path = 5;
  // status — единственный источник правды о текущем этапе документа.
  // Failed фиксирует саму ошибку; восстановление после неё идёт через логи статусов, но статус остаётся единым.
  DocumentStatus status = 6;
  string workflow_id = 7;
  string error = 8;
  string upload_bucket = 9;
  string upload_object_key = 10;
  string markdown_bucket = 11;
  string markdown_object_key = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
  string owner = 15;
  string base_branch = 16;
  bool create_pr = 17;
  string job_id = 18;
  bool force_ocr = 20;
  // Бывшее поле actual_status больше не используется, номер и имя зарезервированы для обратной совместимости.
  reserved 19;
  reserved "actual_status";
}

message CreateDocumentRequest {
  string id = 1;
  string file_name = 2;
  string repository = 3;
  string branch = 4;
  string path = 5;
  string correlation_id = 6;
  int64 content_length = 7;
  string upload_bucket = 8;
  string upload_object_key = 9;
  string markdown_bucket = 10;
  string markdown_object_key = 11;
  string owner = 12;
  string base_branch = 13;
  bool create_pr = 14;
  bool force_ocr = 16;

  reserved 15;
  reserved "entity_specific_path";
}

message GetDocumentRequest {
  string id = 1;
}

message ListDocumentsRequest {
  int32 limit = 1;
  int32 offset = 2;
  DocumentStatus status_filter = 3;
}

message ListDocumentsResponse {
  repeated Document documents = 1;
}

message UpdateDocumentStatusRequest {
  string id = 1;
  DocumentStatus status = 2;
  string reason = 3;
  string original_object_key = 4;
  string markdown_object_key = 5;
  int32 version = 6;
}

message ConfirmUploadRequest {
  string document_id = 1;
  string bucket = 2;
  string object_key = 3;
  string correlation_id = 4;
}

service DocumentService {
  rpc CreateDocument(CreateDocumentRequest) returns (Document);
  rpc GetDocument(GetDocumentRequest) returns (Document);
  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse);
  rpc UpdateDocumentStatus(UpdateDocumentStatusRequest) returns (Document);
  rpc ConfirmUpload(ConfirmUploadRequest) returns (Document);
}
