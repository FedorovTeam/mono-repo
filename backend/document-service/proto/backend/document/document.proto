syntax = "proto3";

package backend.document.v1;

import "google/protobuf/timestamp.proto";

option go_package = "backend-document-service/proto/backend/document/v1;documentv1";

enum DocumentStatus {
  DOCUMENT_STATUS_UNSPECIFIED = 0;
  DOCUMENT_STATUS_UPLOADED = 1;
  DOCUMENT_STATUS_STORED_ORIGINAL = 2;
  DOCUMENT_STATUS_CONVERTED_TO_MARKDOWN = 3;
  DOCUMENT_STATUS_PUBLISHED_TO_GITHUB = 4;
  DOCUMENT_STATUS_FAILED = 5;
}

message Document {
  string id = 1;
  string name = 2;
  DocumentStatus status = 3;
  string original_bucket = 4;
  string original_object_key = 5;
  string markdown_bucket = 6;
  string markdown_object_key = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  repeated DocumentVersion versions = 10;
}

message DocumentVersion {
  string id = 1;
  string document_id = 2;
  int32 version = 3;
  string original_object_key = 4;
  string markdown_object_key = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message DocumentStatusLog {
  string id = 1;
  string document_id = 2;
  DocumentStatus from_status = 3;
  DocumentStatus to_status = 4;
  string reason = 5;
  google.protobuf.Timestamp created_at = 6;
}

message CreateDocumentRequest {
  string name = 1;
  string original_bucket = 2;
  string markdown_bucket = 3;
}

message GetDocumentRequest {
  string id = 1;
}

message ListDocumentsRequest {
  int32 limit = 1;
  int32 offset = 2;
  DocumentStatus status_filter = 3;
}

message ListDocumentsResponse {
  repeated Document documents = 1;
}

message UpdateDocumentStatusRequest {
  string id = 1;
  DocumentStatus status = 2;
  string reason = 3;
  string original_object_key = 4;
  string markdown_object_key = 5;
  int32 version = 6;
}

service DocumentService {
  rpc CreateDocument(CreateDocumentRequest) returns (Document);
  rpc GetDocument(GetDocumentRequest) returns (Document);
  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse);
  rpc UpdateDocumentStatus(UpdateDocumentStatusRequest) returns (Document);
}
