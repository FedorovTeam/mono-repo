server:
  addr: ":9090"
postgres:
  dsn: "postgres://postgres:3&!tAL5bf38yfx@postgres-postgresql.postgres.svc.cluster.local:5432/document?sslmode=disable"
storage:
  original_bucket: "knowledge-original"
  markdown_bucket: "knowledge-md"
services:
  storage_service: "storage-service.storage-service.svc.cluster.local:9090"
  transformer_service: "docling-transformer-service.docling-transformer-service.svc.cluster.local:9090"
  github_publisher_service: "github-publisher-service.github-publisher-service.svc.cluster.local:9090"
  grpc:
    dial_timeout: 5s
    min_connect_timeout: 2s
    backoff:
      base_delay: 1s
      multiplier: 1.6
      jitter: 0.2
      max_delay: 120s
    keepalive:
      time: 30s
      timeout: 10s
      permit_without_stream: true
github:
  owner: "FedorovTeam"
  repository: "knowledge-base"
  branch: "main"
  base_branch: "main"
  base_url: "https://api.github.com"
  commit_message: "Обновление документации"
  pr_title: "Автообновление документа из document-service"
  pr_body: "Этот PR создан сервисом document-service"
  author_name: "Document Service"
  author_email: "document-service@example.com"
reconciler:
  interval: 2m
  min_uploaded_age: 1m
  batch_size: 5
job_follower:
  interval: 5s
  batch_size: 5
  reschedule_after: 5m
stage_worker:
  interval: 5s
  batch_size: 5
  retry_delay: 1m
  grace_period: 15s
  wait_markdown: true
observability:
  logs:
    enabled: true
  traces:
    enabled: false
  metrics:
    enabled: false
