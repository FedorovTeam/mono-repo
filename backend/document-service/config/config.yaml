server:
  addr: ":9090"
postgres:
  dsn: "postgres://postgres:3&!tAL5bf38yfx@postgres-postgresql.postgres.svc.cluster.local:5432/document?sslmode=disable"
storage:
  original_bucket: "knowledge-original"
  markdown_bucket: "knowledge-md"
services:
  preprocess_service: "preprocess-service.preprocess-service.svc.cluster.local:9090"
  storage_service: "storage-service.storage-service.svc.cluster.local:9090"
  transformer_service: "docling-transformer-service.docling-transformer-service.svc.cluster.local:9090"
  github_publisher_service: "github-publisher-service.github-publisher-service.svc.cluster.local:9090"
  table_extractor_service: "table-extractor-service.table-extractor-service.svc.cluster.local:9090"
grpc_clients:
  timeout: 3s
  keepalive:
    time: 5m
    timeout: 5s
    permit_without_stream: false
  backoff:
    base_delay: 1s
    multiplier: 1.6
    jitter: 0.2
    max_delay: 120s
github:
  owner: "FedorovTeam"
  repository: "knowledge-base"
  branch: "main"
  base_branch: "main"
  base_url: "https://api.github.com"
  commit_message: "Обновление документации"
  pr_title: "Автообновление документа из document-service"
  pr_body: "Этот PR создан сервисом document-service"
  author_name: "Document Service"
  author_email: "document-service@example.com"
reconciler:
  interval: 2m
  min_uploaded_age: 1m
  batch_size: 5
job_follower:
  interval: 5s
  batch_size: 5
  reschedule_after: 5m
stage_worker:
  interval: 5s
  batch_size: 5
  convert_batch_size: 1
  retry_delay: 1m
  preprocess_retry_delay: 15s
  grace_period: 15s
  wait_markdown: true
router:
  preprocess_enabled: true
  preprocess_extensions:
    - doc
  table_extractor_enabled: false
  table_extractor_extensions: []
  artifacts_bucket: "knowledge-md"
  artifacts_prefix_template: "tables/{{ .DocumentID }}/{{ .QueueID }}/"
  table_detection_min_count: 1
  force_table_extraction_for_pdf: false
  repositories:
    - owner: "FedorovTeam"
      repository: "knowledge-base"
      preprocess_enabled: true
      preprocess_extensions:
        - doc
      table_extractor_enabled: true
      table_extractor_extensions:
        - pdf
      path_prefix: "knowledge/docs/"
      artifacts_bucket: "knowledge-md"
      artifacts_prefix_template: "tables/{{ .Owner }}/{{ .Repository }}/{{ .DocumentID }}/{{ .QueueID }}/"
observability:
  logs:
    enabled: true
  traces:
    enabled: false
  metrics:
    enabled: false
