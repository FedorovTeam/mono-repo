server:
  port: 8080
security:
  apiKey: "secret"
documentService:
  address: "document.backend.svc.cluster.local:50051"
storageService:
  address: "storage.backend.svc.cluster.local:50052"
temporal:
  address: "temporal-frontend.temporal.svc.cluster.local:7233"
  namespace: "knowledge-base"
  taskQueue: "knowledge-documents"
uploads:
  maxSizeBytes: 10485760
  allowedExtensions:
    - doc
    - docx
  signedUrlTtlSeconds: 900
observability:
  otlpEndpoint: "localhost:4317"
  serviceName: "backend-gateway-service"
logging:
  level: "info"
