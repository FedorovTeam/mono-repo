server:
  port: 8080
security:
  apiKey:
    enabled: true
    value: "secret"
  oidc:
    jwksUrl: "https://auth.tech.fedorov-team.tech/application/o/console/jwks/"
    issuer: "https://auth.tech.fedorov-team.tech/application/o/console/"
    audience: "L6AmiswYzea2gAs5aGfzhLP9jlapG42ppPhtutoF"
documentService:
  address: "document-service.document-service.svc.cluster.local:9090"
  grpc:
    insecure: true
    dialTimeout: 5s
    minConnectTimeout: 3s
    keepalive:
      time: 5m
      timeout: 10s
      permitWithoutStream: false
    backoff:
      baseDelay: 1s
      multiplier: 1.6
      jitter: 0.2
      maxDelay: 30s
storageService:
  address: "storage-service.storage-service.svc.cluster.local:9090"
  grpc:
    insecure: true
    dialTimeout: 5s
    minConnectTimeout: 3s
    keepalive:
      time: 5m
      timeout: 10s
      permitWithoutStream: false
    backoff:
      baseDelay: 1s
      multiplier: 1.6
      jitter: 0.2
      maxDelay: 30s
uploads:
  signedUrlTtlSeconds: 900
observability:
  enabled: false
  otlpEndpoint: "localhost:4317"
  serviceName: "backend-gateway-service"
logging:
  level: "info"
