server:
  port: 8080
security:
  apiKey: "secret"
documentService:
  address: "document-service.document-service.svc.cluster.local:9090"
  grpc:
    insecure: true
    dialTimeout: 5s
    minConnectTimeout: 3s
    keepalive:
      time: 30s
      timeout: 10s
      permitWithoutStream: true
    backoff:
      baseDelay: 1s
      multiplier: 1.6
      jitter: 0.2
      maxDelay: 30s
storageService:
  address: "storage-service.storage-service.svc.cluster.local:9090"
  grpc:
    insecure: true
    dialTimeout: 5s
    minConnectTimeout: 3s
    keepalive:
      time: 30s
      timeout: 10s
      permitWithoutStream: true
    backoff:
      baseDelay: 1s
      multiplier: 1.6
      jitter: 0.2
      maxDelay: 30s
uploads:
  signedUrlTtlSeconds: 900
observability:
  enabled: false
  otlpEndpoint: "localhost:4317"
  serviceName: "backend-gateway-service"
logging:
  level: "info"
