replicaCount: 1
fullnameOverride: gateway-service

image:
  repository: harbor.tech.moiqr.ru/backend/gateway-service
  pullPolicy: Always
  tag: "latest"
imagePullSecrets:
  - name: regcred

service:
  type: ClusterIP
  port: 8080

env:
  SERVICE_NAME: gateway-service
  SERVICE_PORT: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

ingress:
  enabled: true
  host: api.dashboard.moiqr.ru
  tls:
    enabled: true
    issuerRef:
      name: letsencrypt
      kind: ClusterIssuer
