replicaCount: 1
fullnameOverride: gateway-service

image:
  repository: harbor.tech.fedorov-team.tech/backend/gateway-service
  pullPolicy: Always
  tag: "latest"        # будет переписываться CI через `helm-set image.tag=<git_sha>`

# Секрет с dockerconfig.json для Harbor
imagePullSecrets:
  - name: regcred

service:
  type: ClusterIP
  port: 8080

env:
  SERVICE_NAME: gateway-service
  SERVICE_PORT: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

ingress:
  enabled: true
  host: gateway.tech.fedorov-team.tech
  tls:
    enabled: true
    issuerRef:
      name: letsencrypt
      kind: ClusterIssuer
