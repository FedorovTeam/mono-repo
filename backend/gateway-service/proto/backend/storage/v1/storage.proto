syntax = "proto3";

package backend.storage.v1;

option go_package = "backend-gateway-service/proto/backend/storage/v1;storagepb";

// StorageService предоставляет вспомогательные операции для загрузки файлов в MinIO.
service StorageService {
  // GenerateUploadURL возвращает подписанную ссылку для прямой загрузки файла в приватный бакет.
  rpc GenerateUploadURL(GenerateUploadURLRequest) returns (GenerateUploadURLResponse);

  // GenerateDownloadURL возвращает подписанную ссылку для скачивания объекта из приватного бакета.
  rpc GenerateDownloadURL(GenerateDownloadURLRequest) returns (GenerateDownloadURLResponse);
}

message GenerateUploadURLRequest {
  string document_id = 1;
  string file_name = 2;
  int64 content_length = 3;
  string correlation_id = 4;
  int64 expires_in_seconds = 5;
}

message GenerateUploadURLResponse {
  string upload_url = 1;
  string bucket = 2;
  string object_key = 3;
  int64 expires_in_seconds = 4;
  string markdown_bucket = 5;
  string markdown_object_key = 6;
}

message GenerateDownloadURLRequest {
  string bucket = 1;
  string object_key = 2;
  string correlation_id = 3;
  int64 expires_in_seconds = 4;
}

message GenerateDownloadURLResponse {
  string download_url = 1;
  int64 expires_in_seconds = 2;
}
