apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: gateway-service-build
  namespace: argo
  labels:
    workflows.argoproj.io/creator: akadmin
spec:
  entrypoint: build
  serviceAccountName: ci-bot

  # Общие аргументы, которые будут видны в UI
  arguments:
    parameters:
      - name: git_sha
        description: "Git commit SHA to build"
      - name: repo
        description: "GitHub repo (owner/name)"
        default: "FedorovTeam/mono-repo"
      - name: image
        description: "Target image (Harbor)"
        default: "harbor.tech.fedorov-team.tech/backend/gateway-service"
      - name: argocd_app
        description: "Argo CD Application name"
        default: "app-gateway-service"
      - name: argocd_server
        description: "Argo CD server"
        default: "argocd-server.argocd.svc.cluster.local:443"

  volumes:
    - name: docker-config
      secret:
        secretName: harbor-docker-config
    - name: workdir
      emptyDir: {}
    - name: go-build-cache
      emptyDir: {}

  templates:
    # Оркестрация шагов
    - name: build
      dag:
        tasks:
          - name: clone
            template: git-clone
          - name: build-image
            dependencies: [clone]
            template: kaniko-build
          - name: deploy
            dependencies: [build-image]
            template: argocd-deploy

    # 1) Клонирование только backend/gateway-service
    - name: git-clone
      container:
        image: alpine/git:latest
        command: ["sh", "-c"]
        args:
          - |
            set -eu
            ulimit -n 1048576

            REPO="https://${GIT_USERNAME}:${GIT_TOKEN}@github.com/{{workflow.parameters.repo}}.git"
            echo "Cloning $REPO @ {{workflow.parameters.git_sha}}"

            git clone --depth 1 --sparse "$REPO" /workspace
            cd /workspace
            git sparse-checkout init --cone
            git sparse-checkout set backend/gateway-service
            git fetch --depth 1 origin {{workflow.parameters.git_sha}}
            git checkout {{workflow.parameters.git_sha}}

        env:
          - name: GIT_USERNAME
            valueFrom:
              secretKeyRef:
                name: github-secret
                key: username
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: github-secret
                key: password
        volumeMounts:
          - name: workdir
            mountPath: /workspace

    # 2) Kaniko build → Harbor
    - name: kaniko-build
      container:
        image: gcr.io/kaniko-project/executor:v1.22.0
        command: ["sh", "-c"]
        args:
          - |
            set -eu
            ulimit -n 1048576

            /kaniko/executor \
              --dockerfile=/workspace/backend/gateway-service/Dockerfile \
              --context=/workspace/backend/gateway-service \
              --destination={{workflow.parameters.image}}:{{workflow.parameters.git_sha}} \
              --destination={{workflow.parameters.image}}:latest \
              --cache=true \
              --cache-repo=harbor.tech.fedorov-team.tech/backend/kaniko-cache \
              --verbosity=debug
        env:
          - name: DOCKER_CONFIG
            value: /kaniko/.docker
        volumeMounts:
          - name: docker-config
            mountPath: /kaniko/.docker/config.json
            subPath: .dockerconfigjson
          - name: go-build-cache
            mountPath: /go
          - name: workdir
            mountPath: /workspace
        securityContext:
          runAsUser: 0
          privileged: true

    # 3) Деплой через Argo CD
    - name: argocd-deploy
      container:
        image: quay.io/argoproj/argocd:v2.9.3
        command: ["bash", "-c"]
        args:
          - |
            set -eu

            : "${ARGOCD_TOKEN:?ARGOCD_TOKEN is not set}"
            ulimit -n 1048576 || true

            APP="{{workflow.parameters.argocd_app}}"
            SERVER="{{workflow.parameters.argocd_server}}"

            echo "Using Argo CD app: $APP"
            echo "Argo CD server: $SERVER"

            # 1) Проверяем, что приложение существует
            argocd app get "$APP" \
              --server "$SERVER" \
              --auth-token "$ARGOCD_TOKEN" \
              --grpc-web >/dev/null

            # 2) Ждём окончания любых активных операций
            argocd app wait "$APP" \
              --server "$SERVER" \
              --auth-token "$ARGOCD_TOKEN" \
              --grpc-web \
              --operation \
              --timeout 600

            # 3) Выставляем новый image.tag (код 20 = "нет изменений")
            set +e
            argocd app set "$APP" \
              --helm-set image.tag={{workflow.parameters.git_sha}} \
              --server "$SERVER" \
              --auth-token "$ARGOCD_TOKEN" \
              --grpc-web
            RC=$?
            set -e
            if [ "$RC" != "0" ] && [ "$RC" != "20" ]; then
              echo "argocd app set failed with code $RC"
              exit "$RC"
            fi

            # 4) Запускаем sync
            set +e
            argocd app sync "$APP" \
              --server "$SERVER" \
              --auth-token "$ARGOCD_TOKEN" \
              --grpc-web \
              --timeout 600 \
              --prune \
              --retry-limit 1
            RC=$?
            set -e
            if [ "$RC" != "0" ] && [ "$RC" != "20" ]; then
              echo "argocd app sync failed with code $RC"
              exit "$RC"
            fi

            # 5) Ждём sync + health
            argocd app wait "$APP" \
              --server "$SERVER" \
              --auth-token "$ARGOCD_TOKEN" \
              --grpc-web \
              --sync \
              --health \
              --timeout 600
        env:
          - name: ARGOCD_TOKEN
            valueFrom:
              secretKeyRef:
                name: argocd-token
                key: token
