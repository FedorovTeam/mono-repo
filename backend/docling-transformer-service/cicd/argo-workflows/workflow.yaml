# backend/docling-transformer-service/cicd/argo-workflows/workflow.yaml
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: docling-transformer-service
  namespace: argo
  labels:
    workflows.argoproj.io/creator: akadmin
spec:
  entrypoint: build
  serviceAccountName: workflows-admin

  volumes:
    - name: docker-config
      secret:
        secretName: harbor-docker-config
    - name: go-build-cache
      emptyDir: {}

  arguments:
    parameters:
      - name: git_sha        # SHA передаётся при submit

  templates:
    - name: build
      inputs:
        parameters:
          - name: git_sha
      steps:
        - - name: clone
            template: git-clone
            arguments:
              parameters:
                - name: git_sha
                  value: "{{inputs.parameters.git_sha}}"
        - - name: build-image
            template: kaniko-build
            arguments:
              parameters:
                - name: git_sha
                  value: "{{inputs.parameters.git_sha}}"
              artifacts:
                - name: source
                  from: "{{steps.clone.outputs.artifacts.source}}"
        - - name: deploy
            template: argocd-deploy
            arguments:
              parameters:
                - name: git_sha
                  value: "{{inputs.parameters.git_sha}}"

    - name: git-clone
      inputs:
        parameters:
          - name: git_sha
      outputs:
        artifacts:
          - name: source
            path: /workspace
      container:
        image: alpine/git:latest
        command: ["sh", "-c"]
        args:
          - |
            set -e
            ulimit -n 1048576
            REPO="https://${GIT_USERNAME}:${GIT_TOKEN}@github.com/FedorovTeam/mono-repo.git"

            echo "Cloning https://github.com/FedorovTeam/mono-repo.git @ {{inputs.parameters.git_sha}}"
            git clone --depth 1 --sparse "$REPO" /workspace
            cd /workspace
            git sparse-checkout init --cone
            git sparse-checkout set backend/docling-transformer-service
            git fetch --depth 1 origin {{inputs.parameters.git_sha}}
            git checkout {{inputs.parameters.git_sha}}
        env:
          - name: GIT_USERNAME
            valueFrom:
              secretKeyRef:
                name: github-secret
                key: username
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: github-secret
                key: password

    - name: kaniko-build
      inputs:
        parameters:
          - name: git_sha
        artifacts:
          - name: source
            path: /workspace
      container:
        image: gcr.io/kaniko-project/executor:v1.22.0
        command: [ "/kaniko/executor" ]
        args:
          - --dockerfile=/workspace/backend/docling-transformer-service/Dockerfile
          - --context=/workspace/backend/docling-transformer-service
          - --destination=harbor.tech.fedorov-team.tech/backend/docling-transformer-service:{{inputs.parameters.git_sha}}
#          - --destination=harbor.tech.fedorov-team.tech/backend/docling-transformer-service:latest
          - --cache=true
          - --cache-repo=harbor.tech.fedorov-team.tech/backend/kaniko-cache
          - --verbosity=debug
        env:
          - name: DOCKER_CONFIG
            value: /kaniko/.docker
        volumeMounts:
          - name: docker-config
            mountPath: /kaniko/.docker/config.json
            subPath: .dockerconfigjson
          - name: go-build-cache
            mountPath: /go
        securityContext:
          runAsUser: 0
          privileged: true

    - name: argocd-deploy
      inputs:
        parameters:
          - name: git_sha
      container:
        image: quay.io/argoproj/argocd:v2.8.4
        command: ["bash", "-c"]
        args:
          - |
            set -euo pipefail
            : "${ARGOCD_TOKEN:?ARGOCD_TOKEN is not set}"

            # поднять лимит открытых файлов для этого шага (может не подняться выше hard limit контейнера/ноды)
            ulimit -n 1048576 || true

            APP="app-docling-transformer-service"
            SERVER="argocd.tech.fedorov-team.tech"

            # Важно: используем grpc-web везде, и НЕ делаем argocd login (он не нужен при --auth-token)
            argocd app get "$APP" \
              --server "$SERVER" \
              --auth-token "$ARGOCD_TOKEN" \
              --grpc-web >/dev/null

            # ждём, пока не будет активных операций
            argocd app wait "$APP" \
              --server "$SERVER" \
              --auth-token "$ARGOCD_TOKEN" \
              --grpc-web \
              --operation \
              --timeout 600

            # выставляем тег; код 20 = "ничего не изменилось" — НЕ ошибка
            set +e
            argocd app set "$APP" \
              --helm-set-string image.tag={{inputs.parameters.git_sha}} \
              --server "$SERVER" \
              --auth-token "$ARGOCD_TOKEN" \
              --grpc-web
            RC=$?
            set -e
            if [ "$RC" != "0" ] && [ "$RC" != "20" ]; then
              echo "argocd app set failed with code $RC"
              exit "$RC"
            fi

            # запускаем sync
            set +e
            argocd app sync "$APP" \
              --server "$SERVER" \
              --auth-token "$ARGOCD_TOKEN" \
              --grpc-web \
              --timeout 600 \
              --prune \
              --retry-limit 1
            RC=$?
            set -e
            if [ "$RC" != "0" ] && [ "$RC" != "20" ]; then
              echo "argocd app sync failed with code $RC"
              exit "$RC"
            fi

            # ждём синхронизации и здоровья
            argocd app wait "$APP" \
              --server "$SERVER" \
              --auth-token "$ARGOCD_TOKEN" \
              --grpc-web \
              --sync \
              --health \
              --timeout 600
        env:
          - name: ARGOCD_TOKEN
            valueFrom:
              secretKeyRef:
                name: argocd-token
                key: token
