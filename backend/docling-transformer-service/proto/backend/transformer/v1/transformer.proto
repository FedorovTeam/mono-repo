syntax = "proto3";

package backend.transformer.v1;

option go_package = "github.com/mono-repo/docling-transformer-service/proto/backend/transformer/v1;transformerv1";

service TransformerService {
  rpc ConvertDocumentToMarkdown(ConvertDocumentToMarkdownRequest) returns (ConvertDocumentToMarkdownResponse);
}

message ConvertDocumentToMarkdownRequest {
  string document_id = 1;
  string original_bucket = 2;
  string original_object_key = 3;
  string markdown_bucket = 4;
  string markdown_object_key = 5;
  string filename_extension = 6;
}

message ConvertDocumentToMarkdownResponse {
  string queue_id = 1;
  string status = 2;
  string markdown_bucket = 3;
  string markdown_object_key = 4;
  bool waiting_docling = 5;
  bool docling_timeout = 6;
}
