# backend/docling-transformer-service/charts/docling-transformer-service/values.yaml
replicaCount: 1
fullnameOverride: docling-transformer-service

image:
  repository: harbor.tech.fedorov-team.tech/backend/docling-transformer-service
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: regcred

service:
  type: ClusterIP
  port: 8080
  grpcPort: 9090

env:
  SERVICE_NAME: docling-transformer-service
  SERVICE_PORT: 8080
  GRPC_PORT: 9090
  SERVICE_REGION: local

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 400m
    memory: 512Mi

nodeSelector: {}

tolerations: []

affinity: {}
