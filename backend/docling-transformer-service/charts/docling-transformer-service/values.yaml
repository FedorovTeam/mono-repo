replicaCount: 1
fullnameOverride: docling-transformer-service

image:
  repository: harbor.tech.moiqr.ru/backend/docling-transformer-service
  pullPolicy: Always
  tag: "latest"
imagePullSecrets:
  - name: regcred

service:
  type: ClusterIP
  port: 8080
  grpcPort: 9090

env:
  SERVICE_NAME: docling-transformer-service
  SERVICE_PORT: 8080
  GRPC_PORT: 9090
  SERVICE_REGION: local

resources:
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
