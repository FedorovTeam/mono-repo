syntax = "proto3";

package backend.githubpublisher.v1;

option go_package = "backend-github-publisher-service/proto/backend/githubpublisher/v1;githubpublisherv1";

enum PublishResultStatus {
  PUBLISH_RESULT_STATUS_UNSPECIFIED = 0;
  PUBLISH_RESULT_STATUS_SUCCESS = 1;
  PUBLISH_RESULT_STATUS_TEMPORARY_FAILURE = 2;
  PUBLISH_RESULT_STATUS_PERMANENT_FAILURE = 3;
}

enum PublishErrorCode {
  PUBLISH_ERROR_CODE_UNSPECIFIED = 0;
  PUBLISH_ERROR_CODE_TIMEOUT = 1;
  PUBLISH_ERROR_CODE_SERVER_ERROR = 2;
  PUBLISH_ERROR_CODE_RATE_LIMIT = 3;
  PUBLISH_ERROR_CODE_CONFLICT = 4;
  PUBLISH_ERROR_CODE_PERMISSION = 5;
  PUBLISH_ERROR_CODE_NETWORK = 6;
  PUBLISH_ERROR_CODE_NOT_FOUND = 7;
  PUBLISH_ERROR_CODE_UNKNOWN = 8;
}

message PublishMarkdownRequest {
  string owner = 1;
  string repository = 2;
  string branch = 3;
  string base_branch = 4;
  string path = 5;
  string content = 6;
  string commit_message = 7;
  string pr_title = 8;
  string pr_body = 9;
  bool create_pr = 10;
  string correlation_id = 11;
  string author_name = 12;
  string author_email = 13;
  string bucket = 14;
  string object_key = 15;
}

message PublishMarkdownResponse {
  PublishResultStatus status = 1;
  string commit_sha = 2;
  int64 pull_request_number = 3;
  string pull_request_url = 4;
  PublishErrorCode error_code = 5;
  string error_message = 6;
}

service GithubPublisherService {
  rpc PublishMarkdown(PublishMarkdownRequest) returns (PublishMarkdownResponse);
}
