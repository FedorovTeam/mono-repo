[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iltumen-pdf2md"
version = "0.1.0"
description = "Convert Il Tumen voting protocol PDFs to Markdown with checkmarks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyMuPDF>=1.23.0",
]

[project.scripts]
iltumen-pdf2md = "iltumen_pdf2md.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
