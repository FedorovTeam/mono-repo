version: '3.8'

services:
  app_knowledge_console:
    build: .
    container_name: app_knowledge_console
    restart: unless-stopped
    # Если у вас есть .env.production:
    env_file:
      - .env.production

    # Traefik-настройки:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app_knowledge_console.rule=Host(`console.moiqr.ru`)"
      - "traefik.http.routers.app_knowledge_console.entrypoints=websecure"
      - "traefik.http.routers.app_knowledge_console.tls=true"
      - "traefik.http.routers.app_knowledge_console.tls.certresolver=myresolver"

      # Важно: контейнер слушает порт 3000, значит Traefik должен
      # проксировать на 3000
      - "traefik.http.services.app_knowledge_console.loadbalancer.server.port=3000"

    networks:
      - office

networks:
  office:
    external: true
