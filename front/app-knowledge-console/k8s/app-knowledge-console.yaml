apiVersion: v1
kind: Namespace
metadata:
  name: knowledge-console
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-knowledge-console
  namespace: knowledge-console
  labels:
    app: app-knowledge-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-knowledge-console
  template:
    metadata:
      labels:
        app: app-knowledge-console
    spec:
      containers:
        - name: app-knowledge-console
          image: harbor.tech.fedorov-team.tech/frontend/app-knowledge-console:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NEXTAUTH_URL
              value: "https://console.fedorov-team.tech"
            - name: NEXTAUTH_SECRET
              value: "change-me"
            - name: AUTHENTIK_ISSUER
              value: "https://auth.tech.fedorov-team.tech/application/o/console/"
            - name: AUTHENTIK_CLIENT_ID
              value: "L6AmiswYzea2gAs5aGfzhLP9jlapG42ppPhtutoF"
            - name: AUTHENTIK_CLIENT_SECRET
              value: "lGhLYG9Usi845ndGd7R8yEVuauxMKZQYhbBVmcuaPAbewC9pUvQPH5uhSiuSGKWq8nYydBoUDNnbngr38nxiecE1qgeoO7e4nrh3carhwG89a3xoHXENDa1XIfh3sUfP"
            - name: AUTHENTIK_REDIRECT_URI
              value: "https://console.fedorov-team.tech/api/auth/callback/authentik"
            - name: AUTHENTIK_JWKS_URL
              value: "https://auth.tech.fedorov-team.tech/application/o/console/jwks/"
            - name: GATEWAY_URL
              value: "https://gateway.tech.fedorov-team.tech/query"
            - name: NEXT_PUBLIC_AUTHENTIK_LOGOUT_URL
              value: "https://auth.tech.fedorov-team.tech/application/o/console/end-session/"
            - name: NEXT_PUBLIC_AUTHENTIK_POST_LOGOUT_REDIRECT
              value: "https://console.fedorov-team.tech"
            - name: NEXT_PUBLIC_DEFAULT_REPOSITORY
              value: "docs"
            - name: NEXT_PUBLIC_DEFAULT_BRANCH
              value: "main"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: app-knowledge-console
  namespace: knowledge-console
  labels:
    app: app-knowledge-console
spec:
  selector:
    app: app-knowledge-console
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-knowledge-console
  namespace: knowledge-console
  annotations:
    # подставь ваш ingress-класс
    kubernetes.io/ingress.class: traefik
    # или так (если используете ingressClassName, можно убрать аннотацию выше):
    # cert-manager для TLS
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - console.fedorov-team.tech
      secretName: console-fedorov-team-tech-tls
  rules:
    - host: console.fedorov-team.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-knowledge-console
                port:
                  number: 80
