apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app-knowledge-console.name" . }}
  labels:
    {{- include "app-knowledge-console.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "app-knowledge-console.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app-knowledge-console.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: NEXTAUTH_URL
              value: {{ .Values.env.NEXTAUTH_URL | quote }}
            - name: NEXTAUTH_SECRET
              value: {{ .Values.env.NEXTAUTH_SECRET | quote }}
            - name: AUTHENTIK_ISSUER
              value: {{ .Values.env.AUTHENTIK_ISSUER | quote }}
            - name: AUTHENTIK_CLIENT_ID
              value: {{ .Values.env.AUTHENTIK_CLIENT_ID | quote }}
            - name: AUTHENTIK_CLIENT_SECRET
              value: {{ .Values.env.AUTHENTIK_CLIENT_SECRET | quote }}
            - name: AUTHENTIK_REDIRECT_URI
              value: {{ .Values.env.AUTHENTIK_REDIRECT_URI | quote }}
            - name: AUTHENTIK_JWKS_URL
              value: {{ .Values.env.AUTHENTIK_JWKS_URL | quote }}
            - name: GATEWAY_URL
              value: {{ .Values.env.GATEWAY_URL | quote }}
            - name: NEXT_PUBLIC_AUTHENTIK_LOGOUT_URL
              value: {{ .Values.env.NEXT_PUBLIC_AUTHENTIK_LOGOUT_URL | quote }}
            - name: NEXT_PUBLIC_AUTHENTIK_POST_LOGOUT_REDIRECT
              value: {{ .Values.env.NEXT_PUBLIC_AUTHENTIK_POST_LOGOUT_REDIRECT | quote }}
            - name: NEXT_PUBLIC_DEFAULT_REPOSITORY
              value: {{ .Values.env.NEXT_PUBLIC_DEFAULT_REPOSITORY | quote }}
            - name: NEXT_PUBLIC_DEFAULT_BRANCH
              value: {{ .Values.env.NEXT_PUBLIC_DEFAULT_BRANCH | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
