apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app-knowledge-console.name" . }}
  labels:
    {{- include "app-knowledge-console.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "app-knowledge-console.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app-knowledge-console.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: NEXT_PUBLIC_GATEWAY_URL
              value: {{ .Values.env.NEXT_PUBLIC_GATEWAY_URL | quote }}
            - name: NEXT_PUBLIC_API_KEY
              value: {{ .Values.env.NEXT_PUBLIC_API_KEY | quote }}
            - name: NEXT_PUBLIC_DEFAULT_REPOSITORY
              value: {{ .Values.env.NEXT_PUBLIC_DEFAULT_REPOSITORY | quote }}
            - name: NEXT_PUBLIC_DEFAULT_BRANCH
              value: {{ .Values.env.NEXT_PUBLIC_DEFAULT_BRANCH | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
