replicaCount: 1
fullnameOverride: app-knowledge-console

image:
  repository: harbor.tech.fedorov-team.tech/frontend/app-knowledge-console
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: regcred

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  host: console.fedorov-team.tech
  tls:
    enabled: true
    secretName: console-fedorov-team-tech-tls

env:
  NEXTAUTH_URL: "https://console.fedorov-team.tech"
  NEXTAUTH_SECRET: "change-me"
  AUTHENTIK_ISSUER: "https://auth.tech.fedorov-team.tech/application/o/console/"
  AUTHENTIK_CLIENT_ID: "L6AmiswYzea2gAs5aGfzhLP9jlapG42ppPhtutoF"
  AUTHENTIK_CLIENT_SECRET: "lGhLYG9Usi845ndGd7R8yEVuauxMKZQYhbBVmcuaPAbewC9pUvQPH5uhSiuSGKWq8nYydBoUDNnbngr38nxiecE1qgeoO7e4nrh3carhwG89a3xoHXENDa1XIfh3sUfP"
  AUTHENTIK_REDIRECT_URI: "https://console.fedorov-team.tech/api/auth/callback/authentik"
  AUTHENTIK_JWKS_URL: "https://auth.tech.fedorov-team.tech/application/o/console/jwks/"
  GATEWAY_URL: "https://gateway.tech.fedorov-team.tech/query"
  NEXT_PUBLIC_AUTHENTIK_LOGOUT_URL: "https://auth.tech.fedorov-team.tech/application/o/console/end-session/"
  NEXT_PUBLIC_AUTHENTIK_POST_LOGOUT_REDIRECT: "https://console.fedorov-team.tech"
  NEXT_PUBLIC_DEFAULT_REPOSITORY: "docs"
  NEXT_PUBLIC_DEFAULT_BRANCH: "main"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

nodeSelector: {}

tolerations: []

affinity: {}
